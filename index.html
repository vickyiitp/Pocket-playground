  <style>
    /* A modern CSS reset */
    *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body, #root {
      height: 100%;
    }

    :root {
      --font-sans: 'Inter', sans-serif;
      
      /* New Professional Dark Theme Palette */
      --background-rgb: 10 10 20; /* Deep indigo */
      --text-primary: #e2e8f0; /* slate-200 */
      --text-secondary: #94a3b8; /* slate-400 */
      --card-bg: rgba(22, 28, 45, 0.6); /* Semi-transparent indigo */
      --card-border: rgba(100, 116, 139, 0.2); /* slate-500 with opacity */
      --card-hover-border: rgba(100, 116, 139, 0.4);

      /* Category Colors (Slightly desaturated for a more professional feel) */
      --category-microgame-text: #f472b6; /* pink-400 */
      --category-microcreation-text: #60a5fa; /* blue-400 */
      --category-microchallenge-text: #facc15; /* yellow-400 */
      --category-socialduel-text: #c084fc; /* purple-400 */
      --category-curiosity-text: #4ade80; /* green-400 */
      --category-relax-text: #22d3ee; /* cyan-400 */

      /* Glow Colors */
      --category-microgame-glow-color: rgba(244, 114, 182, 0.7);
      --category-microcreation-glow-color: rgba(96, 165, 250, 0.7);
      --category-microchallenge-glow-color: rgba(250, 204, 21, 0.7);
      --category-socialduel-glow-color: rgba(192, 132, 252, 0.7);
      --category-curiosity-glow-color: rgba(74, 222, 128, 0.7);
      --category-relax-glow-color: rgba(34, 211, 238, 0.7);
      --category-kinaesthetic-glow-color: rgba(251, 113, 133, 0.7);
      --category-vocal-glow-color: rgba(251, 146, 60, 0.7);
      --category-quicklaughs-glow-color: rgba(251, 191, 36, 0.7);
    }

    body {
      font-family: var(--font-sans);
      background-color: rgb(var(--background-rgb));
      color: var(--text-primary);
      overflow-x: hidden;
      position: relative;
    }
    
    /* Dynamic Aurora Background */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 10% 20%, rgba(168, 85, 247, 0.15), transparent 30%),
        radial-gradient(circle at 80% 30%, rgba(59, 130, 246, 0.15), transparent 30%),
        radial-gradient(circle at 50% 90%, rgba(244, 63, 94, 0.1), transparent 40%);
      animation: aurora 20s infinite linear;
      z-index: -1;
    }


    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }


    /* Keyframe Animations */
    @keyframes aurora {
      0% { transform: rotate(0deg) scale(1.5); }
      50% { transform: rotate(180deg) scale(1.8); }
      100% { transform: rotate(360deg) scale(1.5); }
    }
    @keyframes pulse {
      50% { opacity: .8; transform: scale(1.05); }
    }
    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }
    @keyframes slideInUp {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes shimmer {
        0% { background-position: -500px 0; }
        100% { background-position: 500px 0; }
    }
    /* Added missing keyframes referenced in components */
    @keyframes fadeInAndScale {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes fadeOutAndScale {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(0.98); }
    }
    @keyframes text-gradient-anim {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    @keyframes logo-intro {
      from {
        opacity: 0;
        transform: translateY(10px) rotate(-15deg) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) rotate(0deg) scale(1);
      }
    }
    
    /* Enhanced IntentGate button glow */
    .intent-button-glow {
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .intent-button-glow:hover {
        transform: translateY(-8px) scale(1.02);
        box-shadow: 0 20px 40px -10px var(--glow-color);
    }
    .intent-button-glow .glow-fx {
        position: absolute; top: 50%; left: 50%; width: 200%; height: 200%;
        background: radial-gradient(circle, var(--glow-color) 0%, transparent 50%);
        transform: translate(-50%, -50%) scale(0);
        opacity: 0.3;
        transition: transform 0.6s ease, opacity 0.8s ease;
    }
    .intent-button-glow:hover .glow-fx {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0;
    }

    #landing-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      opacity: 0;
      transition: opacity 1s ease-out;
    }
  </style>
  <script>
    (function(){
      try {
        const url = new URL(window.location.href);
        const noAnim = url.searchParams.get('noanim') === '1' || localStorage.getItem('ppg:disableAnimations') === '1';
        if (noAnim) document.documentElement.classList.add('no-anim');
        window.toggleAnimations = function(enable){
          if (enable === false) {
            localStorage.setItem('ppg:disableAnimations','1');
            document.documentElement.classList.add('no-anim');
          } else {
            localStorage.removeItem('ppg:disableAnimations');
            document.documentElement.classList.remove('no-anim');
          }
        };
      } catch(e) {}
    })();
  </script>
